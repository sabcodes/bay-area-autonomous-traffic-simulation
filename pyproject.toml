[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bay-area-traffic-sim"
version = "0.1.0"
description = "Reproducible local experiments for autonomous-traffic coordination."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bay Area Autonomous Traffic Simulation contributors" }]
dependencies = [
  "eclipse-sumo>=1.27,<1.28",
  "numpy>=2.0,<3.0",
  "pyproj>=3.7,<4",
  "sumolib>=1.27,<1.28",
  "traci>=1.27,<1.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
where = ["src"]
