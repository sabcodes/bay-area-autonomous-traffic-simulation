[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bay-area-traffic-sim"
version = "0.1.0"
description = "Reproducible local experiments for autonomous-traffic coordination."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bay Area Autonomous Traffic Simulation contributors" }]
dependencies = [
  "numpy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/bay_area_traffic_sim"]
